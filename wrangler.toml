name = "watashi-no-sekai-online"
main = "worker/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*"]
not_found_handling = "single-page-application"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "JEV_BUDGET"
class_name = "JevBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["JevBudget"]

[observability]
enabled = true
